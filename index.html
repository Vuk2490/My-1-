<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7eee7'><title>Mein 1 %</title><style>
:root{--bg:#fbf7f3;--card:#fff;--ink:#292524;--muted:#78716c;--accent:#d98970;--green:#8daf91;--line:#eadfd8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}main{max-width:560px;margin:auto;padding:22px 16px 110px}.hero{background:linear-gradient(135deg,#f7ded4,#eef3e8);border-radius:28px;padding:24px;box-shadow:0 8px 30px #8a6d5c18}.hero h1{font-size:34px;margin:0 0 6px}.hero p{margin:0;color:var(--muted)}.progress{height:12px;background:#fff8;border-radius:99px;margin-top:18px;overflow:hidden}.bar{height:100%;background:var(--green);width:0;transition:.3s}.pct{font-weight:700;margin-top:8px}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 10px}.habit{display:flex;align-items:center;gap:12px;background:var(--card);padding:14px;border-radius:18px;margin:9px 0;border:1px solid var(--line)}.icon{font-size:26px;width:38px;text-align:center}.habit b{flex:1}.check{width:34px;height:34px;border-radius:50%;border:2px solid #d6cbc4;background:white;font-size:20px}.check.on{background:var(--green);border-color:var(--green);color:white}.note{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;min-height:76px;background:white}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;font-size:12px;color:var(--muted)}.dot{margin:6px auto 0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e9e2dd;font-weight:700}.dot.good{background:#b9d2bc}.quote{margin-top:22px;text-align:center;color:var(--muted);font-style:italic}.reset{margin-top:20px;border:0;background:none;color:#a16255;text-decoration:underline}nav{position:fixed;bottom:0;left:0;right:0;background:#fffE;border-top:1px solid var(--line);backdrop-filter:blur(10px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--muted)}
</style></head><body><main><section class='hero'><h1>Mein 1 % 🌱</h1><p>Kleine Schritte. Jeden Tag ein bisschen besser.</p><div class='progress'><div class='bar' id='bar'></div></div><div class='pct' id='pct'>0 von 5 heute ✓</div></section><section class='section'><h2>Heute</h2><div id='habits'></div></section><section class='section'><h2>⭐ Darauf bin ich heute stolz</h2><textarea id='proud' class='note' placeholder='Eine kleine Sache reicht …'></textarea></section><section class='section'><h2>Diese Woche</h2><div class='week' id='week'></div></section><p class='quote'>„Nicht perfekt. Nur 1 % besser.“</p><button class='reset' id='reset'>Heutige Häkchen zurücksetzen</button></main><nav>💗 Gesundheit &nbsp; • &nbsp; 💰 Finanzen &nbsp; • &nbsp; 🧠 Ruhe & Fokus</nav><script>
const H=[['💧','Genug Wasser'],['🚶','10 Min. Bewegung'],['🧠','Etwas nicht aufgeschoben'],['💰','Kein unnötiger Kauf'],['❤️','Etwas für mich getan']];const key=()=>new Date().toISOString().slice(0,10);let data=JSON.parse(localStorage.getItem('mein1pct')||'{}');if(!data[key()])data[key()]={checks:Array(5).fill(false),proud:''};function save(){data[key()].proud=document.querySelector('#proud').value;localStorage.setItem('mein1pct',JSON.stringify(data));renderWeek()}function render(){let box=document.querySelector('#habits');box.innerHTML='';H.forEach((h,i)=>{let d=document.createElement('div');d.className='habit';d.innerHTML=`<span class='icon'>${h[0]}</span><b>${h[1]}</b><button class='check ${data[key()].checks[i]?'on':''}'>${data[key()].checks[i]?'✓':''}</button>`;d.querySelector('button').onclick=()=>{data[key()].checks[i]=!data[key()].checks[i];save();render()};box.appendChild(d)});let n=data[key()].checks.filter(Boolean).length;document.querySelector('#pct').textContent=`${n} von 5 heute ✓`;document.querySelector('#bar').style.width=(n*20)+'%';document.querySelector('#proud').value=data[key()].proud||'';renderWeek()}function renderWeek(){let w=document.querySelector('#week');w.innerHTML='';let names=['So','Mo','Di','Mi','Do','Fr','Sa'];for(let x=6;x>=0;x--){let dt=new Date();dt.setDate(dt.getDate()-x);let k=dt.toISOString().slice(0,10),n=data[k]?.checks?.filter(Boolean).length||0;let e=document.createElement('div');e.className='day';e.innerHTML=`${names[dt.getDay()]}<div class='dot ${n>=3?'good':''}'>${n}</div>`;w.appendChild(e)}}document.querySelector('#proud').oninput=save;document.querySelector('#reset').onclick=()=>{data[key()].checks=Array(5).fill(false);save();render()};render();
</script></body></html>
